name: CI

# 四目标矩阵 + 契约门禁。
# 骨架期（契约已冻结、实现未开工）：check / fmt / info / 零依赖 / 用例收集数 都是**阻断**的；
# 用例本身预期全红（函数体 abort），所以 test 步骤只断"收集到的用例数 ≥ 基线"，不断"全过"。
# 实现相位把 test 的容忍换成真绿即可（见 AGENTS.md 交付形状）。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# G5「期望值冻结」**不在 CI 上跑**（10-09 owner 拍 C 案）：本仓是直推 master 的口径，
# 而 G5 需要"上一笔"当基准；原先那个 `if: pull_request` 的 job 至今零次执行
# （现读 `gh run list --event pull_request` 为空）——一道从没被执行过的闸比没有闸更误导。
# 复跑法是本地一条命令，写在这里以免下一个人再去找 CI：
#   GATE_FREEZE_BASE=<上一笔 sha> bash scripts/contract_gate.sh
# 该改期望值的那一笔必须在正文给外部读数来源（门禁会列出被碰的冻结面文件当提醒）。
env:
  MOON_VERSION: latest

jobs:
  gate:
    name: 契约门禁（wasm + js）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      # 10-09 踩到的：安装脚本只装二进制 + bundle core（日志里只有 "Downloading moonbit/core"、"Bundling core"），
      # **不带注册表索引**。本仓零依赖时期这条看不出来（压根不查索引）；sched 引入 moonbitlang/async 之后
      # 四档编译 + 门禁全红，moon 自己给的下一步就是那句 `Warning: you may need to run \`moon update\``。
      - name: moon update（刷新注册表索引，否则解析不到 moonbitlang/async）
        run: moon update

      - name: moon version
        run: moon version --all

      # G16 不再联网取参照 jar：类面已固化成仓内清单 docs/spec/hutool-classes.tsv
      # （带 version + sha256 头；脚本常量 REF_VERSION 与它不一致就判红，所以也不会拿旧表对新 jar）。
      # 只有"升级 hutool"那一笔才需要重生成：
      #   curl -fsSL https://repo1.maven.org/maven2/cn/hutool/hutool-all/<新版>/hutool-all-<新版>.jar -o /tmp/h.jar
      #   先改 scripts/core_surface.py 的 REF_VERSION=<新版>，再 HUTOOL_JAR=/tmp/h.jar python scripts/core_surface.py --write
      #   —— 那份 diff 就是"新版多了哪些类"的工作清单，比每次默默核对同一份有用。

      - name: Coverage trace for G15（未覆盖行棘轮要有数据，否则那一格只能 SKIP）
        run: moon test --target wasm --enable-coverage >/dev/null 2>&1 || echo "覆盖率数据没生成：G15 会在门禁里显式 SKIP，不会伪装成通过"

      - name: Run contract gate G1-G19
        # 地板 = `moon test --target <档>` 汇总行里的 Total tests（10-10 本机现读：wasm、js 两档 1548；
        # 上一代是 10-09 的 1531，负向对照当时打的是 `只收集 1531 条 < 基线 1532`——留原文不改写，
        # 换代读数只往上加一行）。
        # 这个数与 scripts/contract_gate.sh 里的默认值是同一个——两处不一致就是门禁自己漂了。
        # 这里原先还写着一张「393 = text 23 + digest 20 + …」的分解表，那是 16 个包时代的切片、
        # 与现读不符，已删；要逐包条数就现读 ROADMAP.md 末的 READINGS 生成块（G11 每轮重生成）。
        env:
          BASELINE_TESTS: "1548"
          GATE_TARGETS: "wasm js"
        run: bash scripts/contract_gate.sh

  targets:
    name: 多目标编译 ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      # 同 gate job：不刷索引就解析不到 moonbitlang/async（见该处注释）。
      - name: moon update
        run: moon update

      # 四档都必须编得过（本库立身之本）。唯一的例外是 `sched`：它 import moonbitlang/async，
      # wasm-gc 档没有异步可执行入口，已由包级 supported_targets 摘掉那一档（读数见 docs/spec/24-sched.md §1）。
      - name: moon check --target ${{ matrix.target }}
        run: moon check --target ${{ matrix.target }}

      - name: 逐档全绿 + 用例数地板（骨架期那条例外的三条判据见正文）
        env:
          TARGET: ${{ matrix.target }}
          # 地板 1536＝四档里最低那一档（wasm-gc）的现读条数（10-10 本机 `moon test --target wasm-gc`
          # = 1536，且 sched 的 12 条 async 用例在该档根本不收集——该包 supported_targets 摘掉了 wasm-gc，
          # 见 docs/spec/24-sched.md §1；wasm/js 两档本机都是 1548）。钉在等值上 ⇒ 掉一条就红。
          # 上一代读数是 10-09 的 1519/1531，三段对照当时实测：
          #   FLOOR=1519 真跑 wasm-gc ⇒ exit 0 并打 collected=1519 failed=0；
          #   FLOOR=1520 ⇒ exit 1（"收集用例数不足"）；
          #   喂一份真有 2 红的样本 ⇒ exit 1（::error:: + 两条 文件:行 与 label 全打出来）。
          # 10-10 这一代同三段重跑（FLOOR=1536 放行 / 1537 判红 / 样本红点名）——批① PR-A 的 17 条红
          # 是骨架态设计红（体是 `PR-B：契约骨架` 的 abort），收集数照算，这一步会把它们逐条点名出来。
          FLOOR: "1536"
        run: |
          out=$(moon test --target "$TARGET" 2>&1 || true)
          # 汇总行按 `^Total tests: ` 锚定再取数（真样本实测：失败明细那几行长的是
          # `[包名] test 文件:行 ("<用例名>") failed: Error`，不带数字；只有汇总行才是 `failed: <数字>`。
          # 早先按"全文第一个匹配"取数会被这类消息里的数字抢先，锚定汇总行才是那一条）。
          summ=$(printf '%s\n' "$out" | grep -E '^Total tests: ' | tail -1)
          total=$(printf '%s' "$summ" | grep -oE 'Total tests: [0-9]+' | grep -oE '[0-9]+')
          failed=$(printf '%s' "$summ" | grep -oE 'failed: [0-9]+' | grep -oE '[0-9]+')
          echo "target=$TARGET collected=${total:-0} failed=${failed:-无汇总行}"
          # 10-09 之前这一步**只数收集数、不断通过**，于是 native 档那条
          # `collected=1531 passed=1530 failed=1` 一路绿了好几轮（根因与收法见 docs/spec/23-typex.md §17.10）。
          # 现在红即 exit 1，并把红逐条点名——失败行自带 文件:行 与 label，够定位。
          if [ -n "$summ" ] && [ "${failed:-0}" != "0" ]; then
            echo "::error::$TARGET 档有 $failed 条红用例"
            echo "::group::$TARGET 红用例点名（失败行 + 汇总行 + 末 30 行原文）"
            printf '%s\n' "$out" | grep -E ' failed: ' | head -30
            echo "$summ"
            printf '%s\n' "$out" | tail -30
            echo "::endgroup::"
            exit 1
          fi
          if [ "${total:-0}" -ge "$FLOOR" ]; then exit 0; fi
          # native 档的骨架期例外，判据三条同时成立才豁免（缺一即 FAIL）：
          #   ① 这一档确实是 native；② 失败方式是 SIGABRT（native 测试驱动不兜 panic，
          #   一个未实现的 abort 就把整个测试进程打死，拿不到 Total tests 汇总）；
          #   ③ wasm 档当场确有红用例（红来自骨架，不是这台机器坏了）。
          # 全部转绿后 ③ 不成立 ⇒ 这条自动变回硬检查，不会留成永真死格。
          wasm=$(moon test --target wasm 2>&1 || true)
          wsumm=$(printf '%s\n' "$wasm" | grep -E '^Total tests: ' | tail -1)
          red=$(printf '%s' "$wsumm" | grep -oE 'failed: [0-9]+' | head -1 | grep -oE '[0-9]+')
          if [ "$TARGET" = "native" ] && printf '%s\n' "$out" | grep -q "SIGABRT" \
             && [ "${red:-0}" -gt 0 ]; then
            echo "::notice::SKIP native 用例计数：骨架期 $red 条红用例在 native 档以 SIGABRT 终止测试进程（该档驱动不兜 panic，wasm/js 档兜）。实现转绿后这条自动恢复成硬检查。"
            exit 0
          fi
          echo "FAIL: $TARGET 档收集用例数不足（静默丢弃 = 没有套件）"
          echo "::group::$TARGET moon test 原始输出（末 40 行）"
          printf '%s\n' "$out" | tail -40
          echo "::endgroup::"
          exit 1

