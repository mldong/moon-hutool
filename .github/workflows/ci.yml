name: CI

# 四目标矩阵 + 契约门禁。
# 骨架期（契约已冻结、实现未开工）：check / fmt / info / 零依赖 / 用例收集数 都是**阻断**的；
# 用例本身预期全红（函数体 abort），所以 test 步骤只断"收集到的用例数 ≥ 基线"，不断"全过"。
# 实现相位把 test 的容忍换成真绿即可（见 AGENTS.md 交付形状）。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MOON_VERSION: latest

jobs:
  gate:
    name: 契约门禁（wasm + js）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: moon version --all

      - name: Run contract gate G1-G13
        # 基线 327 = text 23 + digest 16 + date 47 + id 32 + codec 38 + coll 16 + mapx 28 + num 67 + conv 33 + re 22 + valid 5
        #（契约冻结态也计数：
          # 骨架期红是设计态，但用例必须被收集到，收不到就是静默丢套件）。用例只许增不许减：
          # 减到低于基线就是有用例被悄悄删掉（负向对照：本机把基线抬到 314 当场 RED）
        env:
          BASELINE_TESTS: "327"
          GATE_TARGETS: "wasm js"
        run: bash scripts/contract_gate.sh

  targets:
    name: 多目标编译 ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      # 零依赖 + 零 FFI + 零 async 的推论：四档都必须编得过。任一档红就是破坏了本库的立身之本。
      - name: moon check --target ${{ matrix.target }}
        run: moon check --target ${{ matrix.target }}

      - name: 收集用例数（不要求通过，骨架期实现是 abort）
        env:
          TARGET: ${{ matrix.target }}
        run: |
          out=$(moon test --target "$TARGET" 2>&1 || true)
          total=$(printf '%s\n' "$out" | grep -oE 'Total tests: [0-9]+' | grep -oE '[0-9]+' | head -1)
          echo "target=$TARGET collected=${total:-0}"
          if [ "${total:-0}" -ge 20 ]; then exit 0; fi
          # native 档的骨架期例外，判据三条同时成立才豁免（缺一即 FAIL）：
          #   ① 这一档确实是 native；② 失败方式是 SIGABRT（native 测试驱动不兜 panic，
          #   一个未实现的 abort 就把整个测试进程打死，拿不到 Total tests 汇总）；
          #   ③ wasm 档当场确有红用例（红来自骨架，不是这台机器坏了）。
          # 全部转绿后 ③ 不成立 ⇒ 这条自动变回硬检查，不会留成永真死格。
          wasm=$(moon test --target wasm 2>&1 || true)
          red=$(printf '%s\n' "$wasm" | grep -oE 'failed: [0-9]+' | head -1 | grep -oE '[0-9]+')
          if [ "$TARGET" = "native" ] && printf '%s\n' "$out" | grep -q "SIGABRT" \
             && [ "${red:-0}" -gt 0 ]; then
            echo "::notice::SKIP native 用例计数：骨架期 $red 条红用例在 native 档以 SIGABRT 终止测试进程（该档驱动不兜 panic，wasm/js 档兜）。实现转绿后这条自动恢复成硬检查。"
            exit 0
          fi
          echo "FAIL: $TARGET 档收集用例数不足（静默丢弃 = 没有套件）"
          echo "::group::$TARGET moon test 原始输出（末 40 行）"
          printf '%s\n' "$out" | tail -40
          echo "::endgroup::"
          exit 1

  expect-freeze:
    name: 期望值冻结（仅 PR）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 实现 PR 不许动测试期望值与 spec 的"读数来源"列；要动必须单独一笔（人工评审）。
      # 给了 GATE_FREEZE_BASE 才激活 G5（脚本内其余判据照常跑）。
      - name: G5
        env:
          GATE_FREEZE_BASE: ${{ github.event.pull_request.base.sha }}
          GATE_TARGETS: "wasm"
          BASELINE_TESTS: "327"   # 与主门禁同一基线（曾滞后在 227 上，成了只走过场的弱判据）
        run: bash scripts/contract_gate.sh
